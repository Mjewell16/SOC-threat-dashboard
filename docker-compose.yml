services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: soc_dashboard
      MYSQL_USER: aegis_app
      MYSQL_PASSWORD: ${AEGIS_DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      AEGIS_DB_HOST: db
      AEGIS_DB_PORT: "3306"
      AEGIS_DB_USER: aegis_app
      AEGIS_DB_PASSWORD: ${AEGIS_DB_PASSWORD}
      AEGIS_DB_NAME: soc_dashboard
    ports:
      - "8501:8501"

volumes:
  db_data:
